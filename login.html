<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | StudySync</title>

    <link rel="stylesheet" href="./CSS/variables.css" />
    <link rel="stylesheet" href="./CSS/auth.css" />
  </head>

  <body>
    <main class="auth-page">
      <!-- Brand -->

      <a href="index.html" class="auth-logo">
        <span class="logo-mark">S</span>
        <span>StudySync</span>
      </a>

      <!-- Login Card -->

      <section class="auth-card">
        <div class="auth-header">
          <span class="auth-eyebrow"> Welcome back </span>

          <h1>
            Good to see you
            <span>again.</span>
          </h1>

          <p>Log in to continue keeping yourself accountable.</p>
        </div>

        <!-- Login Form -->

        <form id="login-form" class="auth-form">
          <!-- Email -->

          <div class="form-group">
            <label for="email"> Email address </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <!-- Password -->

          <div class="form-group">
            <div class="form-label-row">
              <label for="password"> Password </label>

              <a href="#"> Forgot password? </a>
            </div>

            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="password-toggle"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
          </div>

          <!-- Error message -->

          <p id="login-message" class="form-message" aria-live="polite"></p>

          <!-- Submit -->

          <button type="submit" class="auth-submit">Log in</button>
        </form>

        <!-- Sign up -->

        <p class="auth-switch">
          Don't have an account?

          <a href="signup.html"> Create one </a>
        </p>
      </section>

      <!-- Footer -->

      <p class="auth-footer">© 2026 StudySync</p>
    </main>

    <!-- JavaScript -->

    <script src="./JS/login.js"></script>
  </body>
</html>
